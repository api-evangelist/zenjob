name: Zenjob
description: Zenjob is a Berlin-based staffing platform that connects businesses with
  vetted temporary workers (students and side-jobbers) through a mobile app and a
  self-service booking platform (Buchungsplattform). Companies create shifts, staff
  them in real time, track working hours, and handle invoicing in one place. Zenjob
  offers an integration layer (marketed as "Schnittstellen (API)") for personnel
  management, shift creation and staffing, time tracking, and billing, plus partner
  integrations with workforce and vendor-management systems including Quinyx, ATOSS,
  Ubeya, and compleet. The API is partner/consultation-led (arranged via a scheduled
  onboarding call) rather than a self-serve public developer program; there is no
  public developer portal, OpenAPI definition, or SDK. Backed by 500 Global, Zenjob
  was surfaced as a portfolio company and enriched into the API Evangelist network.
